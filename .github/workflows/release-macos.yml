name: macOS preview release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag matching package.json (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.arch }} preview
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DO_NOT_USE_HARD_LINKS: '1'
    steps:
      - name: Validate tag syntax
        run: |
          node -e "if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_TAG || '')) throw new Error('A version tag is required')"
      - name: Check out the version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.20.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Validate version and tag commit
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          assert.equal(tag, `v${JSON.parse(readFileSync('package.json', 'utf8')).version}`);
          const resolve = ref => execFileSync('git', ['rev-parse', ref], { encoding: 'utf8' }).trim();
          assert.equal(resolve('HEAD'), resolve(`refs/tags/${tag}^{commit}`));
          NODE
      - name: Install locked build dependencies and Electron runtime
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
      - name: Run regression tests
        run: pnpm test
      - name: Build renderer and original/third-party notices
        run: pnpm build
      - name: Package an ad-hoc signed, unnotarized preview
        run: pnpm exec electron-builder --config electron-builder.yml --mac --"$BUILD_ARCH" --publish never
      - name: Verify package boundaries, runtime notices, and checksums
        run: node .github/scripts/verify-macos-package.mjs "$BUILD_ARCH"
      - name: Exercise packaged application using temporary documents
        run: |
          if [ "$BUILD_ARCH" = arm64 ]; then app_path=release/mac-arm64/EasyMD.app; else app_path=release/mac/EasyMD.app; fi
          "$app_path/Contents/MacOS/EasyMD" --smoke-test
      - name: Exercise Finder cold launch with an existing Markdown document
        timeout-minutes: 4
        run: |
          if [ "$BUILD_ARCH" = arm64 ]; then app_path=release/mac-arm64/EasyMD.app; else app_path=release/mac/EasyMD.app; fi
          node .github/scripts/smoke-finder-open.mjs "$app_path"
      - name: Upload only release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/build-info-*.json
            release/SHA256SUMS-*.txt

  draft-release:
    name: Create draft prerelease
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download both verified architectures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-*-preview
          merge-multiple: true
          path: artifacts
      - name: Merge and recheck SHA-256 manifest
        run: |
          cat artifacts/SHA256SUMS-*.txt | LC_ALL=C sort -k2 > artifacts/SHA256SUMS
          cd artifacts
          sha256sum --check SHA256SUMS
      - name: Create or refresh a draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/create-macos-draft.mjs
