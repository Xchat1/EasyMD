<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyMD 预览隐私回归测试</title>
  <style>
    body{font:16px/1.6 system-ui;max-width:1000px;margin:40px auto;padding:0 20px}
    li{margin:12px 0;white-space:pre-wrap}.pass{color:#157a35}.fail{color:#c42626}
    iframe{position:fixed;left:-10000px;top:0;width:600px;height:400px;border:0}
  </style>
</head>
<body>
  <h1>EasyMD 预览隐私回归测试</h1>
  <p>仅使用示例文稿和临时隔离预览，不读写用户文稿，不打开系统打印窗口。</p>
  <p>配合浏览器请求拦截验收：privacy-test.invalid/blocked/ 路径不应收到请求；/allowed/ 路径仅用于显式联网授权测试。</p>
  <ol id="results"></ol>
  <p id="summary" aria-live="polite">正在运行…</p>
  <script type="module">
    import { renderMarkdown } from '../src/utils/markdown.ts';
    import { renderMermaidSvg } from '../src/utils/diagrams.ts';
    import { createPreviewDocument, createClipboardHtml } from '../src/utils/previewPrivacy.ts';
    import { openLocalFile } from '../src/utils/fileSystem.ts';

    let passed = 0, failed = 0;
    const parse = html => new DOMParser().parseFromString(html, 'text/html');
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const pause = duration => new Promise(resolve => setTimeout(resolve, duration));
    const blocked = name => `https://privacy-test.invalid/blocked/${name}`;
    const allowed = name => `https://privacy-test.invalid/allowed/${name}`;
    const raster = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=';
    const presentationAttributes = new Set(['fill', 'stroke', 'filter', 'mask', 'clip-path', 'marker', 'marker-start', 'marker-mid', 'marker-end', 'cursor']);
    const run = async (name, operation) => {
      window.__easymdPrivacyPhase = name;
      const item = document.createElement('li');
      document.getElementById('results').append(item);
      try {
        await operation();
        passed++; item.className = 'pass'; item.textContent = `PASS — ${name}`;
      } catch (error) {
        failed++; item.className = 'fail'; item.textContent = `FAIL — ${name}\n${error.stack || error.message}`;
      }
    };

    function passiveUrls(root) {
      const elements = root.querySelectorAll ? [...root.querySelectorAll('*')] : [];
      if (root.nodeType === Node.ELEMENT_NODE) elements.unshift(root);
      const hits = [];
      for (const element of elements) {
        const tag = element.localName?.toLowerCase();
        for (const attr of [...element.attributes]) {
          const name = attr.name.toLowerCase();
          const navigation = (tag === 'a' || tag === 'area') && (name === 'href' || name === 'xlink:href');
          const passive = ['src', 'srcset', 'poster', 'background', 'ping', 'action', 'formaction', 'data'].includes(name)
            || presentationAttributes.has(name)
            || (!navigation && ['href', 'xlink:href'].includes(name));
          if (passive && attr.value.includes('privacy-test.invalid/blocked/')) hits.push(`${tag}[${name}]`);
        }
      }
      return hits;
    }

    // Adoption into an active Document can load images even in a detached div.
    // Catch that before the browser sends a request, rather than just checking
    // a second sanitized copy after renderMarkdown has already returned.
    async function withoutPrematureResourceAdoption(operation) {
      const restore = [];
      const violations = [];
      const guard = (receiver, nodes) => {
        if (receiver.ownerDocument !== document) return;
        for (const node of nodes) {
          if (!(node instanceof Node)) continue;
          const hits = passiveUrls(node);
          if (hits.length) {
            violations.push(...hits);
            throw new Error(`过滤之前已把被动外部资源交给活动文档：${hits.join(', ')}`);
          }
        }
      };
      for (const [prototype, names] of [
        [Node.prototype, ['appendChild', 'insertBefore', 'replaceChild']],
        [Element.prototype, ['append', 'prepend', 'replaceChildren']],
      ]) {
        for (const name of names) {
          const original = prototype[name];
          prototype[name] = function(...args) { guard(this, args); return original.apply(this, args); };
          restore.push(() => { prototype[name] = original; });
        }
      }
      const innerHtml = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
      Object.defineProperty(Element.prototype, 'innerHTML', {
        ...innerHtml,
        set(value) {
          if (this.ownerDocument === document && typeof value === 'string' && value.includes('privacy-test.invalid/blocked/')) {
            const hits = passiveUrls(parse(value));
            if (hits.length) {
              violations.push(...hits);
              throw new Error(`过滤之前已使用 innerHTML 创建被动资源：${hits.join(', ')}`);
            }
          }
          return innerHtml.set.call(this, value);
        },
      });
      restore.push(() => Object.defineProperty(Element.prototype, 'innerHTML', innerHtml));
      try {
        const result = await operation();
        assert(violations.length === 0, '净化过程中发生过提前资源加载');
        return result;
      } finally {
        restore.reverse().forEach(operation => operation());
      }
    }

    async function loadOpaqueFixture(html, messageType) {
      const frame = document.createElement('iframe');
      frame.title = '隐私测试临时预览';
      frame.setAttribute('sandbox', 'allow-scripts allow-modals allow-forms');
      let timer, onMessage;
      try {
        const response = new Promise((resolve, reject) => {
          onMessage = event => {
            if (event.source === frame.contentWindow && event.data?.type === messageType) resolve(event.data);
          };
          addEventListener('message', onMessage);
          timer = setTimeout(() => reject(new Error('隔离预览未按预期回报；CSP 可能阻止了可信 bootstrap')), 4000);
        });
        frame.srcdoc = html;
        document.body.appendChild(frame);
        const message = await response;
        await pause(150);
        return message;
      } finally {
        clearTimeout(timer); removeEventListener('message', onMessage); frame.remove();
      }
    }

    await run('单次 Markdown 净化在返回前就阻止远程被动资源', async () => {
      const content = [
        `![remote](${blocked('markdown-image.png')})`,
        `<picture><source srcset="${blocked('source.png')} 2x"><img src="${blocked('raw-image.png')}" srcset="${blocked('srcset.png')} 2x"></picture>`,
        `<video poster="${blocked('poster.png')}" src="${blocked('video.mp4')}"><source src="${blocked('media.mp4')}"><track src="${blocked('track.vtt')}"></video>`,
        `<audio src="${blocked('audio.mp3')}"></audio>`,
        `<svg><image href="${blocked('svg-image.png')}"></image><use xlink:href="${blocked('external.svg')}#node"></use></svg>`,
      ].join('\n');
      const html = await withoutPrematureResourceAdoption(() => renderMarkdown(content));
      assert(passiveUrls(parse(html)).length === 0, '返回的 Markdown 仍带被动外部资源 URL');
    });

    await run('默认保留内嵌图片与主动外链，同时移除链接 ping', async () => {
      const html = await renderMarkdown(`![embedded](${raster})\n\n[External](${allowed('article')})\n\n<a href="${allowed('article')}" ping="${blocked('ping')}">Raw link</a>`);
      const doc = parse(html);
      assert(doc.querySelector('img')?.getAttribute('src') === raster, '离线模式误删内嵌 PNG');
      const links = [...doc.querySelectorAll('a')];
      assert(links.length === 2 && links.every(link => link.target === '_blank' && link.relList.contains('noopener') && link.relList.contains('noreferrer')), '主动外链的隔离属性不完整');
      assert(!doc.querySelector('a[ping]'), '外链 ping 仍可能发送跟踪请求');
    });

    await run('默认阻止 SVG 展示属性中的外部 URL、CSS 转义和注释绕过', async () => {
      const escaped = String.fromCharCode(92);
      const resources = [...presentationAttributes].map(attribute => `<rect ${attribute}="url(${blocked(`svg-${attribute}.svg`)}#paint)" width="10" height="10"></rect>`);
      resources.push(`<rect fill="u${escaped}72l(${blocked('svg-escaped.svg')}#paint)" width="10" height="10"></rect>`);
      resources.push(`<rect fill="url(/**/${blocked('svg-comment.svg')}#paint)" width="10" height="10"></rect>`);
      const content = `<svg>${resources.join('')}<rect fill="url(#local-paint)" width="10" height="10"></rect></svg>`;
      const html = await withoutPrematureResourceAdoption(() => renderMarkdown(content));
      const doc = parse(html);
      assert(passiveUrls(doc).length === 0, 'SVG 展示属性仍包含外部资源 URL');
      assert([...doc.querySelectorAll('[fill]')].some(element => element.getAttribute('fill') === 'url(#local-paint)'), '本地 SVG 片段引用被误删');
    });

    await run('SVG 图像函数没有 url() 时仍被阻止，普通颜色与本地引用保留', async () => {
      const values = [
        `image-set('${blocked('image-set.svg')}' 1x)`,
        `-webkit-image-set('${blocked('webkit-image-set.svg')}' 1x)`,
        `image('${blocked('css-image.svg')}')`,
        `cross-fade(image-set('${blocked('nested-image-set.svg')}' 1x),rgb(0,0,0),50%)`,
        `calc(image-set('${blocked('calc-image-set.svg')}' 1x))`,
      ];
      const content = `<svg>${values.map(value => `<rect mask="${value}" width="10" height="10"></rect>`).join('')}<rect fill="rgb(1, 2, 3)" stroke="url(#local-paint)"></rect></svg>`;
      for (const operation of [() => renderMarkdown(content), () => createClipboardHtml(content)]) {
        const html = await withoutPrematureResourceAdoption(operation);
        const doc = parse(html);
        assert(passiveUrls(doc).length === 0, '无 url() 的 CSS 图像函数仍保留外部资源');
        assert([...doc.querySelectorAll('[fill]')].some(element => element.getAttribute('fill') === 'rgb(1, 2, 3)'), '纯 RGB 颜色被误删');
        assert([...doc.querySelectorAll('[stroke]')].some(element => element.getAttribute('stroke') === 'url(#local-paint)'), '本地 SVG URL 被误删');
      }
    });

    await run('显式允许联网时 Markdown 保留远程图片', async () => {
      const html = await renderMarkdown(`![remote](${allowed('markdown-image.png')})`, true);
      const image = parse(html).querySelector('img');
      assert(image?.getAttribute('src') === allowed('markdown-image.png'), '联网授权未恢复远程图片');
      assert(image.getAttribute('referrerpolicy') === 'no-referrer', '联网图片暴露编辑器地址');
    });

    await run('默认 H5 去掉脚本、事件、导航、表单目标和外部资源', async () => {
      const content = `<!doctype html><html><head>
        <base href="${blocked('base/')}" target="_top">
        <meta http-equiv="refresh" content="0;url=${blocked('refresh')}">
        <link rel="dns-prefetch" href="${blocked('dns')}"><link rel="preconnect" href="${blocked('preconnect')}">
        <link rel="prefetch" href="${blocked('prefetch')}"><link rel="modulepreload" href="${blocked('module.js')}">
        <style>@import url('${blocked('import.css')}'); @font-face{font-family:review;src:url('${blocked('font.woff2')}')} .probe{font-family:review;color:rgb(17,34,51);background-image:url('${blocked('background.png')}')}</style>
        </head><body onload="window.__documentScriptRan=true">
        <script>window.__documentScriptRan=true<\/script><script src="${blocked('script.js')}"><\/script>
        <img src="${blocked('h5-image.png')}" srcset="${blocked('h5-srcset.png')} 2x" onerror="window.__documentScriptRan=true">
        <iframe src="${blocked('frame')}"></iframe><iframe srcdoc="<img src='${blocked('nested.png')}'>"></iframe>
        <object data="${blocked('object')}"></object><embed src="${blocked('embed')}">
        <form action="${blocked('submit')}" method="post"><input name="example" value="demo"><button formaction="${blocked('alternate-submit')}">Submit</button></form>
        <a href="${blocked('navigate')}" ping="${blocked('h5-ping')}">Go</a>
        <video poster="${blocked('h5-poster.png')}"><source src="${blocked('h5-video.mp4')}"></video>
        <svg><image href="${blocked('h5-svg.png')}"></image><use xlink:href="${blocked('h5-external.svg')}#node"></use></svg>
        <div class="probe" style="background-image:url('${blocked('inline-background.png')}')">Safe content</div></body></html>`;
      const nonce = crypto.randomUUID();
      const doc = parse(createPreviewDocument(content, false, nonce));
      assert(!doc.querySelector('script,base,iframe,object,embed,meta[http-equiv="refresh" i]'), '默认 HTML 仍有脚本、嵌套页面或自动导航');
      assert(![...doc.querySelectorAll('*')].some(node => [...node.attributes].some(attr => /^on/i.test(attr.name))), '默认 HTML 仍保留事件处理器');
      assert(!doc.querySelector('[action],[formaction],[ping]'), '默认 HTML 仍可提交表单或发送链接 ping');
      assert(!doc.querySelector('a[href^="https:"],link[href]'), '默认 HTML 仍可外部导航或预连接');
      assert(passiveUrls(doc).length === 0, '默认 HTML 仍保留外部被动 URL');
      const policy = doc.querySelector('meta[http-equiv="Content-Security-Policy" i]')?.content || '';
      assert(policy.includes('default-src') && policy.includes('connect-src') && policy.includes('form-action'), '默认 HTML 缺少资源、连接或表单 CSP');
      const messageType = `privacy-static-${crypto.randomUUID()}`;
      const bootstrap = doc.createElement('script'); bootstrap.setAttribute('nonce', nonce);
      bootstrap.textContent = `parent.postMessage({type:${JSON.stringify(messageType)},documentScriptRan:window.__documentScriptRan===true,bodyText:document.body.textContent,computedColor:getComputedStyle(document.querySelector('.probe')).color},'*')`;
      doc.body.appendChild(bootstrap);
      const result = await loadOpaqueFixture('<!doctype html>\n' + doc.documentElement.outerHTML, messageType);
      assert(!result.documentScriptRan && result.bodyText.includes('Safe content'), '隔离预览运行了文稿脚本或丢失安全内容');
      assert(result.computedColor === 'rgb(17, 34, 51)', '离线预览丢失文稿 head 内的本地样式');
    });

    await run('打印 nonce 只放行应用 bootstrap，不放行文稿脚本', async () => {
      const nonce = crypto.randomUUID();
      const content = `<p>Printable demo</p><script nonce="${nonce}">window.__documentScriptRan=true<\/script><img src="${blocked('print.png')}" onerror="window.__documentScriptRan=true">`;
      const doc = parse(createPreviewDocument(content, false, nonce));
      assert(!doc.querySelector('script'), '文稿提供的 nonce 脚本没有被移除');
      const messageType = `privacy-print-${crypto.randomUUID()}`;
      const bootstrap = doc.createElement('script'); bootstrap.setAttribute('nonce', nonce);
      bootstrap.textContent = `parent.postMessage({type:${JSON.stringify(messageType)},bootstrapRan:true,documentScriptRan:window.__documentScriptRan===true},'*')`;
      doc.body.appendChild(bootstrap);
      const result = await loadOpaqueFixture('<!doctype html>\n' + doc.documentElement.outerHTML, messageType);
      assert(result.bootstrapRan && !result.documentScriptRan, '打印授权混淆了应用脚本与文稿脚本');
    });

    await run('未提供打印 nonce 时默认 H5 不保留可执行脚本', async () => {
      const doc = parse(createPreviewDocument('<p>Static demo</p><script>window.__documentScriptRan=true<\/script>'));
      assert(!doc.querySelector('script'), '默认文稿仍带可执行脚本');
      const policy = doc.querySelector('meta[http-equiv="Content-Security-Policy" i]')?.content || '';
      assert(/script-src\s+'none'(?:\s*;|\s*$)/.test(policy), '默认脚本 CSP 没有关闭脚本');
    });

    await run('默认富文本复制移除脚本、CSS 与 SVG 外部展示资源', async () => {
      const escaped = String.fromCharCode(92);
      const content = `<style>@import url('${blocked('clipboard.css')}');body{background:url('${blocked('clipboard-background.png')}')}</style>
        <script>window.__documentScriptRan=true<\/script>
        <p style="background-image:url('${blocked('clipboard-inline.png')}')">Copy demo</p>
        <img src="${blocked('clipboard-image.png')}" srcset="${blocked('clipboard-srcset.png')} 2x" onerror="alert(1)">
        <svg><rect fill="url(${blocked('clipboard-fill.svg')}#paint)" stroke="u${escaped}72l(${blocked('clipboard-escaped.svg')}#paint)"></rect><rect fill="url(/**/${blocked('clipboard-comment.svg')}#paint)"></rect><rect fill="url(#local-paint)"></rect></svg>`;
      const html = await withoutPrematureResourceAdoption(() => createClipboardHtml(content));
      const doc = parse(html);
      assert(!doc.querySelector('style,script,[style],[onerror]'), '剪贴板 HTML 仍保留文稿脚本或 CSS');
      assert(passiveUrls(doc).length === 0, '剪贴板 HTML 仍有可在粘贴目标加载的外部资源');
      assert(doc.body.textContent.includes('Copy demo'), '复制内容被整体丢弃');
      assert([...doc.querySelectorAll('[fill]')].some(element => element.getAttribute('fill') === 'url(#local-paint)'), '复制误删 SVG 本地片段引用');
    });

    await run('联网授权后 H5 可执行脚本，但仍读不到父窗口文稿', async () => {
      const messageType = `privacy-online-${crypto.randomUUID()}`;
      const source = `<p>Online demo</p><script>(()=>{let parentReadable=false;try{void parent.document.body.innerText;parentReadable=true;}catch{}parent.postMessage({type:${JSON.stringify(messageType)},scriptRan:true,parentReadable},'*');})()<\/script>`;
      const html = createPreviewDocument(source, true);
      assert(parse(html).querySelector('script'), '联网授权未保留 H5 脚本');
      const result = await loadOpaqueFixture(html, messageType);
      assert(result.scriptRan && !result.parentReadable, '联网授权未保持不透明来源隔离');
    });

    await run('联网授权后 H5 保留外部资源和表单目标', async () => {
      const source = `<img src="${allowed('h5-image.png')}"><script src="${allowed('h5-script.js')}"><\/script><form action="${allowed('submit')}"><button>Send</button></form>`;
      const doc = parse(createPreviewDocument(source, true));
      assert(doc.querySelector('img')?.getAttribute('src') === allowed('h5-image.png'), '联网授权未保留 HTML 图片');
      assert(doc.querySelector('script')?.getAttribute('src') === allowed('h5-script.js'), '联网授权未保留 HTML 外部脚本');
      assert(doc.querySelector('form')?.getAttribute('action') === allowed('submit'), '联网授权未保留表单目标');
    });

    async function withFakeFilePicker(file, operation) {
      const originalPicker = Object.getOwnPropertyDescriptor(window, 'showOpenFilePicker');
      const originalClick = HTMLInputElement.prototype.click;
      let pickerCalls = 0, fallbackCalls = 0;
      try {
        HTMLInputElement.prototype.click = function() { fallbackCalls++; throw new Error('不应打开备用文件选择器'); };
        Object.defineProperty(window, 'showOpenFilePicker', { configurable: true, writable: true, value: async () => {
          pickerCalls++;
          return [{ getFile: async () => file }];
        } });
        await operation(() => ({ pickerCalls, fallbackCalls }));
      } finally {
        HTMLInputElement.prototype.click = originalClick;
        if (originalPicker) Object.defineProperty(window, 'showOpenFilePicker', originalPicker);
        else delete window.showOpenFilePicker;
      }
    }

    await run('超过 2 MiB 的文件在读取前拒绝，且不转入备用选择器', async () => {
      let readCalls = 0;
      const file = { name: 'oversized-demo.md', size: 2 * 1024 * 1024 + 1, text: async () => { readCalls++; return 'demo'; } };
      await withFakeFilePicker(file, async counts => {
        let error;
        try { await openLocalFile(); } catch (cause) { error = cause; }
        assert(error instanceof RangeError, '超限文件没有以 RangeError 拒绝');
        assert(readCalls === 0, '超限文件仍被完整读取');
        assert(counts().pickerCalls === 1 && counts().fallbackCalls === 0, '超限后又打开了备用文件选择器');
      });
    });

    await run('读取后按 UTF-8 字节数再次拒绝超限内容', async () => {
      let readCalls = 0;
      const content = '中'.repeat(Math.floor(2 * 1024 * 1024 / 3) + 1);
      const file = { name: 'decoded-demo.md', size: 1, text: async () => { readCalls++; return content; } };
      await withFakeFilePicker(file, async counts => {
        let error;
        try { await openLocalFile(); } catch (cause) { error = cause; }
        assert(error instanceof RangeError, 'UTF-8 超限文本没有以 RangeError 拒绝');
        assert(readCalls === 1, '读取后大小校验没有执行');
        assert(counts().fallbackCalls === 0, 'UTF-8 超限后又打开了备用选择器');
      });
    });

    await run('默认 Mermaid 在渲染前拒绝图片节点与自定义资源配置', async () => {
      const sources = [
        `flowchart LR\nA@{ img: "${blocked('mermaid.png')}", label: "demo", h: 40 }`,
        '%%{init: {"themeCSS":"body{color:red}"}}%%\nflowchart LR\nA --> B',
        '---\nconfig:\n  theme: dark\n---\nflowchart LR\nA --> B',
        'flowchart LR\nA --> B\nclassDef default fill:red',
        'flowchart LR\nA --> B\nstyle A fill:red',
        'flowchart LR\nA --> B\nlinkStyle 0 stroke:red',
        `flowchart LR\nA["<img src='${blocked('mermaid-label.png')}'>"] --> B`,
        `sequenceDiagram\nparticipant Alice\nproperties Alice: {"icon":"${blocked('sequence-properties.png')}"}\nAlice->>Bob: Hello`,
        `sequenceDiagram\nparticipant Alice\ndetails Alice: {"properties":{"icon":"${blocked('sequence-details.png')}"}}\nAlice->>Bob: Hello`,
        `C4Context\nPerson(user,"User")\nSystem_Ext(system,"Remote","Example","${blocked('c4-icon.png')}")`,
      ];
      for (const source of sources) {
        let rejected = false;
        try { await renderMermaidSvg(source); } catch { rejected = true; }
        assert(rejected, `离线图表仍接受潜在资源配置：${source.split('\n')[0]}`);
      }
    });

    await run('默认 Mermaid 仍渲染普通流程图、时序图、类图与 ER 图', async () => {
      const sources = [
        'flowchart LR\nA[Start] -->|Next| B[End]',
        'sequenceDiagram\nAlice->>Bob: Hello',
        'classDiagram\nAnimal <|-- Duck\nAnimal : +String name',
        'erDiagram\nCUSTOMER ||--o{ ORDER : places\nCUSTOMER {\n string name\n}',
      ];
      for (const source of sources) {
        const svg = await renderMermaidSvg(source);
        assert(parse(svg).querySelector('svg'), '离线图表无法生成 SVG');
        assert(!svg.includes('privacy-test.invalid'), '普通图表出现了外部 URL');
      }
    });

    window.__easymdPrivacyPhase = 'finished';
    window.__easymdPrivacyFinished = { passed, failed };
    const summary = document.getElementById('summary');
    summary.className = failed ? 'fail' : 'pass';
    summary.textContent = `完成：${passed} 项通过，${failed} 项失败。`;
    document.title = `${failed ? 'FAIL' : 'PASS'} — EasyMD 隐私测试`;
  </script>
</body>
</html>
